[project]
name = "vball-core"
version = "0.1.0"
description = "Shared VBall domain code: settings, database models, logging"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.8",
    "sqlalchemy[asyncio]>=2.0.40",
    "psycopg[binary]>=3.2",
    "alembic>=1.15",
    "structlog>=25.1",
    "boto3>=1.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vball_core"]
