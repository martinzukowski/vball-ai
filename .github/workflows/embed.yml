name: Embed slice

# Helpers for rally analysis: the Worker's analyze job embeds the first slice of a video itself
# and starts this workflow (repository_dispatch "embed") for the others, one machine per slice.
# Each streams only its slice of the playback copy from storage and uploads the rows; the
# analyze job joins them (and redoes any slice that fails). See services/worker/.../shards.py.

on:
  repository_dispatch:
    types: [embed]

permissions:
  contents: read

jobs:
  slice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ github.event.client_payload.shards }}
    env:
      VBALL_ENV: production
      VBALL_LOG_JSON: "true"
      VBALL_DATABASE_URL: ${{ secrets.VBALL_DATABASE_URL }}
      VBALL_SUPABASE_URL: ${{ secrets.VBALL_SUPABASE_URL }}
      VBALL_S3_ENDPOINT_URL: ${{ secrets.VBALL_S3_ENDPOINT_URL }}
      VBALL_S3_REGION: ${{ secrets.VBALL_S3_REGION }}
      VBALL_S3_BUCKET: ${{ secrets.VBALL_S3_BUCKET }}
      VBALL_S3_ACCESS_KEY_ID: ${{ secrets.VBALL_S3_ACCESS_KEY_ID }}
      VBALL_S3_SECRET_ACCESS_KEY: ${{ secrets.VBALL_S3_SECRET_ACCESS_KEY }}
      HF_HOME: ${{ github.workspace }}/../hf
    steps:
      - uses: actions/checkout@v5
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../hf
          key: hf-dinov2-small-v1
      - run: uv sync --frozen --no-dev --package vball-worker
      - name: Embed this slice
        env:
          VIDEO: ${{ github.event.client_payload.video }}
          AREA: ${{ toJSON(github.event.client_payload.play_area) }}
          START: ${{ matrix.shard.start }}
          STEPS: ${{ matrix.shard.steps }}
          OUT: ${{ matrix.shard.out }}
        run: |
          if [ "$AREA" = "null" ]; then AREA=""; fi
          uv run --no-sync python -m vball_worker.shards "$VIDEO" "$START" "$STEPS" "$OUT" "$AREA"
