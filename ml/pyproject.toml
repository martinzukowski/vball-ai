[project]
name = "vball-ml"
version = "0.1.0"
description = "VBall model training and evaluation (rally detection)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vball-core",
    "numpy>=2.0",
    "scipy>=1.14",
    "torch>=2.6",
    "transformers>=4.50",
    "pillow>=11.0",
]

[tool.uv.sources]
vball-core = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vball_ml"]
