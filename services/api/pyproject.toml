[project]
name = "vball-api"
version = "0.1.0"
description = "VBall HTTP API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vball-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "anyio>=4.8",
]

[project.scripts]
vball-api-openapi = "vball_api.openapi:main"

[tool.uv.sources]
vball-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vball_api"]
