[project]
name = "vball-worker"
version = "0.1.0"
description = "VBall background worker: ingest (probe, proxy transcode) and analysis jobs"
requires-python = ">=3.12,<3.13"
dependencies = ["vball-core"]

[project.scripts]
vball-worker = "vball_worker.__main__:main"

[tool.uv.sources]
vball-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vball_worker"]
